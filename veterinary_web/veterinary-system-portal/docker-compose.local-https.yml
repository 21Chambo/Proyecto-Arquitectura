services:
  portal:
    ports:
      - "${PORTAL_HTTPS_PORT:-3443}:8443"
    volumes:
      - ./veterinary-system-portal/nginx/default.local-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./veterinary-system-portal/nginx/certs:/etc/nginx/certs:ro
  api:
    environment:
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:${PORTAL_PORT:-3000},http://127.0.0.1:${PORTAL_PORT:-3000},https://localhost:${PORTAL_HTTPS_PORT:-3443},https://127.0.0.1:${PORTAL_HTTPS_PORT:-3443}"
