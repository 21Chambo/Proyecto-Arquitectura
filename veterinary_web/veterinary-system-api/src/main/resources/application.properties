server.port=9090
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://veterinary-system-db:3306/db_unab}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:veterinary}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:veterinary}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL57Dialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_ORG_HIBERNATE_SQL:WARN}
logging.level.org.springframework.web=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB:INFO}
logging.level.com.backend.unab=${LOGGING_LEVEL_COM_BACKEND_UNAB:INFO}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://13.223.141.227:3000,http://localhost:4200,http://13.223.141.227:4200,https://localhost:3443,https://13.223.141.227:3443}
springdoc.swagger-ui.path=/swagger-ui.html
