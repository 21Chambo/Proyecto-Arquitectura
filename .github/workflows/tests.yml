name: API and portal tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-compose:
    name: Production Compose contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validar secretos obligatorios y puertos privados
        run: python3 veterinary_web/scripts/test_production_compose.py

  api:
    name: API - Linux / Java 17
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: veterinary_web/veterinary-system-api/pom.xml
      - name: Verificar permiso del wrapper y ejecutar todas las pruebas
        working-directory: veterinary_web/veterinary-system-api
        run: |
          test -x ./mvnw
          ./mvnw -B verify

  portal:
    name: Portal - Chrome headless
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: veterinary_web/veterinary-system-portal/package-lock.json
      - name: Preparar Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48483d551c22a1fe6154c6a195ccc6d5773dc8c4 # v2
      - name: Instalar desde el lockfile
        working-directory: veterinary_web/veterinary-system-portal
        run: npm ci
      - name: Ejecutar pruebas sin interfaz ni vigilancia
        working-directory: veterinary_web/veterinary-system-portal
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:ci
