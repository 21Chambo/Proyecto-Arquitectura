name: Pruebas automáticas

on:
  pull_request:
    branches: [main]
  push:
    branches: [semana-2, main]

permissions:
  contents: read

jobs:
  pruebas-api:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Ejecutar pruebas del API
        run: ./mvnw -B verify
        working-directory: veterinary_web/veterinary-system-api

  pruebas-portal:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: veterinary_web/veterinary-system-portal/package-lock.json
      - name: Instalar Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Instalar dependencias del portal
        run: npm ci
        working-directory: veterinary_web/veterinary-system-portal
      - name: Ejecutar pruebas del portal
        run: npm run test:ci
        working-directory: veterinary_web/veterinary-system-portal
        env:
          CHROME_BIN: /usr/bin/google-chrome
