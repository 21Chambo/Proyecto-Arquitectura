name: Trivy and GHCR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  API_IMAGE: ghcr.io/21chambo/proyecto-arquitectura-api
  PORTAL_IMAGE: ghcr.io/21chambo/proyecto-arquitectura-portal

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  scan-build-publish:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Escanear el código
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: veterinary_web
          severity: CRITICAL
          exit-code: "1"

      - name: Construir la imagen del API
        run: docker build -t "$API_IMAGE:$GITHUB_SHA" ./veterinary_web/veterinary-system-api

      - name: Escanear la imagen del API
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/21chambo/proyecto-arquitectura-api:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"

      - name: Construir la imagen del portal
        run: docker build -t "$PORTAL_IMAGE:$GITHUB_SHA" ./veterinary_web/veterinary-system-portal

      - name: Escanear la imagen del portal
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/21chambo/proyecto-arquitectura-portal:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"

      - name: Iniciar sesión en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imágenes en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$API_IMAGE:$GITHUB_SHA"
          docker push "$PORTAL_IMAGE:$GITHUB_SHA"
